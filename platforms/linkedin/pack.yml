{
  "id": "linkedin",
  "name": "LinkedIn",
  "marketBlaster": "linkedin",
  "ai": "draft",
  "formats": [
    "text",
    "image",
    "carousel",
    "video"
  ],
  "textLimit": "unknown",
  "titleLimit": "unknown",
  "media": [
    {
      "kind": "video",
      "maxBytes": {
        "value": 5000000000,
        "source": "linkedin-2"
      },
      "maxSeconds": {
        "value": 900,
        "source": "linkedin-2"
      }
    }
  ],
  "disclosure": {
    "text": {
      "rule": "Paid brand relationships, including free products exchanged for value, require the partnership label.",
      "source": "linkedin-4"
    },
    "media": "unknown",
    "voice": "unknown"
  },
  "rubric": [
    {
      "id": "hook",
      "question": "Does the opening name a concrete professional problem or outcome before the backstory?",
      "anchors": {
        "0": "The opening has no identifiable subject or result.",
        "1": "A subject appears, but the problem or outcome is vague or delayed.",
        "2": "The opening identifies the subject and a concrete problem or outcome."
      }
    },
    {
      "id": "audience-fit",
      "question": "Can a developer lead or founder tell why the lesson matters to their work?",
      "anchors": {
        "0": "No intended reader or relevant situation is identifiable.",
        "1": "A reader group or situation is hinted at but not connected to the content.",
        "2": "The intended reader and relevant situation are explicit."
      }
    },
    {
      "id": "simplicity",
      "question": "Can a reader identify the problem, action and takeaway without decoding jargon?",
      "anchors": {
        "0": "The reader cannot reconstruct the main point or sequence.",
        "1": "The main point is present but key context or ordering is missing.",
        "2": "The main point and necessary steps are clear and ordered."
      }
    },
    {
      "id": "anti-slop",
      "question": "Are unsupported superlatives and generic motivational claims absent?",
      "anchors": {
        "0": "The candidate relies on hype, fabricated urgency or unsupported claims.",
        "1": "Some concrete substance is present but generic or inflated language remains.",
        "2": "Concrete language replaces hype and claims are supported."
      }
    },
    {
      "id": "platform-fit",
      "question": "Does the post teach a professional lesson rather than burying it under a pitch?",
      "anchors": {
        "0": "The candidate ignores the destination’s format or community rules.",
        "1": "The format or community is identified but a relevant rule or constraint remains unchecked.",
        "2": "The format and relevant destination rules are checked and followed."
      }
    },
    {
      "id": "visual-quality",
      "question": "Are document pages and images readable on a phone and described in alt text?",
      "anchors": {
        "0": "The visual is unreadable or lacks its relevant alternative or captions.",
        "1": "The visual is partly readable or an alternative or caption is incomplete.",
        "2": "Key content is readable and relevant alternatives or accurate captions are present."
      },
      "appliesTo": [
        "image",
        "carousel",
        "poster",
        "video",
        "diagram",
        "logo",
        "terminal-demo"
      ]
    },
    {
      "id": "value",
      "question": "Does a verifiable example show what the reader can apply?",
      "anchors": {
        "0": "No supported takeaway or useful example is identifiable.",
        "1": "A takeaway is present but its evidence or practical detail is incomplete.",
        "2": "A specific takeaway is supported by a concrete example or source."
      }
    },
    {
      "id": "verifiable-example",
      "question": "Is one example traceable to an accessible source or demonstrated result?",
      "anchors": {
        "0": "No example or source is supplied.",
        "1": "An example is described but cannot be traced to evidence.",
        "2": "An accessible source or demonstrated result supports the example."
      }
    },
    {
      "id": "partnership-disclosure",
      "question": "Is any paid brand relationship identified with the required partnership label?",
      "anchors": {
        "0": "A required partnership label is missing.",
        "1": "A relationship is acknowledged but its label is unresolved.",
        "2": "The applicable partnership label is present or no relationship exists."
      }
    }
  ],
  "sources": [
    "linkedin-1",
    "linkedin-2",
    "linkedin-3",
    "linkedin-4",
    "cross-platform-63",
    "cross-platform-64"
  ],
  "notes": [
    "[JUDGEMENT] Rubric scores are editorial aids, not predictions of reach.",
    "Check actual account, route, community and current requirements before publication.",
    "LinkedIn recommends disclosure of substantial non-obvious AI use; this is not a universal mandatory AI label."
  ]
}
