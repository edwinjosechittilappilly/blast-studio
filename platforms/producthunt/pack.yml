{
  "id": "producthunt",
  "name": "Product Hunt",
  "marketBlaster": "producthunt",
  "ai": "outline",
  "formats": [
    "text",
    "image",
    "video"
  ],
  "textLimit": {
    "value": 500,
    "source": "producthunt-39"
  },
  "titleLimit": {
    "value": 40,
    "source": "producthunt-39"
  },
  "media": [
    {
      "kind": "image",
      "maxBytes": "unknown",
      "width": "unknown",
      "height": "unknown"
    }
  ],
  "disclosure": {
    "text": "unknown",
    "media": "unknown",
    "voice": "unknown"
  },
  "rubric": [
    {
      "id": "hook",
      "question": "Do the product name and tagline explain what the tool does?",
      "anchors": {
        "0": "The opening has no identifiable subject or result.",
        "1": "A subject appears, but the problem or outcome is vague or delayed.",
        "2": "The opening identifies the subject and a concrete problem or outcome."
      }
    },
    {
      "id": "audience-fit",
      "question": "Can a potential user identify the intended user and problem?",
      "anchors": {
        "0": "No intended reader or relevant situation is identifiable.",
        "1": "A reader group or situation is hinted at but not connected to the content.",
        "2": "The intended reader and relevant situation are explicit."
      }
    },
    {
      "id": "simplicity",
      "question": "Can a reader understand the benefit before implementation detail?",
      "anchors": {
        "0": "The reader cannot reconstruct the main point or sequence.",
        "1": "The main point is present but key context or ordering is missing.",
        "2": "The main point and necessary steps are clear and ordered."
      }
    },
    {
      "id": "anti-slop",
      "question": "Are false scarcity, unsupported superiority and upvote requests absent?",
      "anchors": {
        "0": "The candidate relies on hype, fabricated urgency or unsupported claims.",
        "1": "Some concrete substance is present but generic or inflated language remains.",
        "2": "Concrete language replaces hype and claims are supported."
      }
    },
    {
      "id": "platform-fit",
      "question": "Are name, tagline, description, tags and asset limits checked?",
      "anchors": {
        "0": "The candidate ignores the destination’s format or community rules.",
        "1": "The format or community is identified but a relevant rule or constraint remains unchecked.",
        "2": "The format and relevant destination rules are checked and followed."
      }
    },
    {
      "id": "visual-quality",
      "question": "Does the gallery show real functionality with readable labels?",
      "anchors": {
        "0": "The visual is unreadable or lacks its relevant alternative or captions.",
        "1": "The visual is partly readable or an alternative or caption is incomplete.",
        "2": "Key content is readable and relevant alternatives or accurate captions are present."
      },
      "appliesTo": [
        "image",
        "carousel",
        "poster",
        "video",
        "diagram",
        "logo",
        "terminal-demo"
      ]
    },
    {
      "id": "value",
      "question": "Does the page explain a differentiated benefit supported by the product?",
      "anchors": {
        "0": "No supported takeaway or useful example is identifiable.",
        "1": "A takeaway is present but its evidence or practical detail is incomplete.",
        "2": "A specific takeaway is supported by a concrete example or source."
      }
    },
    {
      "id": "feedback-not-votes",
      "question": "Does the launch request genuine feedback without soliciting upvotes?",
      "anchors": {
        "0": "The launch solicits or purchases upvotes.",
        "1": "The request is ambiguous about votes versus feedback.",
        "2": "The request invites genuine feedback without asking for votes."
      }
    },
    {
      "id": "asset-limits",
      "question": "Are product name, tagline, description and logo requirements checked against the actual launch page?",
      "anchors": {
        "0": "A checked field or logo violates a known limit.",
        "1": "Some fields or logo requirements remain unchecked.",
        "2": "Name, tagline, description and logo requirements are checked against the current launch page."
      }
    }
  ],
  "outlineRubric": [
    {
      "id": "coverage",
      "question": "Do the talking points cover the problem, relevant context and useful takeaway for potential users evaluating a product launch?",
      "anchors": {
        "0": "The problem or takeaway is absent.",
        "1": "The problem and takeaway are present but important context is missing.",
        "2": "The problem, relevant context and actionable takeaway are covered as talking points."
      }
    },
    {
      "id": "evidence",
      "question": "Do the talking points identify evidence for the a release debugging tool example without inventing experience?",
      "anchors": {
        "0": "The outline asserts unsupported facts or invented experience.",
        "1": "Some evidence is identified but a material assertion lacks a source.",
        "2": "Material assertions point to evidence and uncertainty is noted."
      }
    },
    {
      "id": "community-rules-checked",
      "question": "Have the rules and authorship policy for the intended producthunt destination been checked before the human writes?",
      "anchors": {
        "0": "The target or its rules are not identified.",
        "1": "The target is named but current rules or authorship restrictions are unchecked.",
        "2": "The named destination’s current rules and authorship restrictions are recorded."
      }
    }
  ],
  "sources": [
    "producthunt-37",
    "producthunt-38",
    "producthunt-39",
    "cross-platform-63",
    "cross-platform-64"
  ],
  "notes": [
    "[JUDGEMENT] Rubric scores are editorial aids, not predictions of reach.",
    "Check actual account, route, community and current requirements before publication.",
    "Title limit refers to product name; text limit refers to description; tagline 60 and maker comment 5,000 characters. Logo: 240×240 recommended, JPG/PNG/GIF up to 2 MB; gallery: at least one image, 1270×760 recommended."
  ]
}
