<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sample release card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body { background: #211643; color: #f7f3ff; font-family: Arial, sans-serif; }
  main { height: 100%; padding: 76px 82px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 16px; color: #ded0ff; font-size: 22px; font-weight: bold; letter-spacing: .04em; }
  .mark { width: 28px; height: 28px; background: #c3a4ff; transform: rotate(45deg); }
  .line { margin-top: 46px; width: 100%; height: 2px; background: #75639e; }
  h1 { margin: auto 0 24px; font-size: 84px; line-height: 1.04; letter-spacing: -.035em; max-width: 750px; }
  p { margin: 0; max-width: 680px; font-size: 29px; line-height: 1.4; color: #e0d4f6; }
  footer { margin-top: auto; padding-top: 56px; display: flex; justify-content: space-between; align-items: center; color: #d7c7f3; font-size: 20px; }
  .dot { width: 54px; height: 54px; border-radius: 50%; background: #c3a4ff; }
</style>
</head>
<body>
<main>
  <div class="top"><span class="mark"></span> BLAST STUDIO</div>
  <div class="line"></div>
  <h1>A small release,<br>ready to share.</h1>
  <p>Turn an idea into content for the places your audience reads.</p>
  <footer><span>Sample card · rendered offline</span><span class="dot"></span></footer>
</main>
</body>
</html>
