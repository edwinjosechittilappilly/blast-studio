name: goldens

# Run by hand to (re)generate the Linux perceptual goldens in test/goldens/linux and open a PR with them.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: goldens
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate goldens, then check they reproduce
        run: |
          make goldens
          node --test test/goldens.test.ts
      - name: Open a PR with the goldens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add test/goldens/linux
          if git diff --cached --quiet; then echo "Goldens unchanged."; exit 0; fi
          branch="goldens/linux-${GITHUB_RUN_ID}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" checkout -b "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Linux perceptual goldens"
          git push origin "$branch"
          gh pr create --title "Linux perceptual goldens" --body "Generated by the goldens workflow on ubuntu-latest (run ${GITHUB_RUN_ID}); the test re-ran against them before this PR. Review the images before merging."
