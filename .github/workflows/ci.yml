name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - name: Set up Market Blaster integration
        env:
          MB_CHECKOUT_TOKEN: ${{ secrets.MB_CHECKOUT_TOKEN }}
        run: |
          if [ -n "$MB_CHECKOUT_TOKEN" ]; then
            git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$MB_CHECKOUT_TOKEN"; }; f' \
              clone https://github.com/edwinjosechittilappilly/market-blaster.git ../market-blaster
            npm ci --prefix ../market-blaster
          fi
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install D2
        run: |
          # Direct release download: the install script queries the GitHub API, which rate-limits runners (403).
          curl -fsSLo /tmp/d2.tgz https://github.com/terrastruct/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz
          echo "5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  /tmp/d2.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/d2.tgz -C /tmp && install /tmp/d2-v0.9.0/bin/d2 "$HOME/.local/bin/d2"
          "$HOME/.local/bin/d2" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm test
      - name: Stress program timeout cleanup
        run: |
          for i in {1..20}; do
            node --test --test-name-pattern='^program timeout' test/jobs.test.ts
          done
      - run: npm run typecheck
      - run: make docs
